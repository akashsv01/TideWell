# Render Blueprint for Tidewell's two backend services. In Render: New > Blueprint > pick this repo.
# Secrets are marked sync: false, so Render asks for them once in the dashboard; nothing secret lives here.
# The frontend (Next.js) goes on Vercel, not here. The database is Tiger Data (already in the cloud).
services:
  # --- The API (FastAPI) ---------------------------------------------------------------------
  - type: web
    name: tidewell-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Applies the (idempotent) migrations and seeds the demo providers, then serves.
    # Seed Maya once by hand (Render Shell): python scripts/seed_maya.py
    startCommand: python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: RESEND_FROM
        value: "Tidewell <onboarding@resend.dev>"
      # true lets anyone join a video visit at any time (handy for a live demo); false = 15 minutes before only.
      - key: VIDEO_JOIN_ANYTIME
        value: "false"
      - key: TIGER_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      # Optional: Daily video rooms instead of the WebRTC server below.
      - key: DAILY_API_KEY
        sync: false
      # Optional: texts to the support person in an emergency.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # This API's own address, e.g. https://tidewell-api.onrender.com (doctor email links, iPhone guide).
      - key: PUBLIC_API_URL
        sync: false
      # The video server below, e.g. https://tidewell-video.onrender.com
      - key: WEBRTC_BASE_URL
        sync: false
      # Comma-separated. Your Vercel URL(s), e.g. https://tidewell.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false

  # --- Video visits (WebRTC signaling, Flask-SocketIO) ------------------------------------------
  # One worker only: rooms live in memory and Socket.IO needs every message from a browser to reach it.
  - type: web
    name: tidewell-video
    runtime: python
    rootDir: video-server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
